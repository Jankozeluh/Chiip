# Publishes the website (site/) to GitHub Pages on every push to main (M12, D-179).
# Only GitHub's own actions, each pinned to an exact version. One-time setup, in the repository's
# settings: Pages -> Build and deployment -> Source: GitHub Actions (docs/RELEASING.md).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2
      - name: Package the site
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
